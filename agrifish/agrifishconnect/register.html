<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agrifish Connect - Register</title>

    
    <link rel="stylesheet" href="register.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"  >

  
</head>
<body>
  <div class="register-container">
    <h1>Agrifish Connect</h1>
    <p>Empowering farmers and fishers through smart trade and sustainable connections.</p>

<form id="registerForm">
<input type="text" id="firstname" name="firstname" placeholder="First Name" required>
<input type="text" id="lastname" name="lastname" placeholder="Last Name" required>
<input type="text" id="middlename" name="middlename" placeholder="Middle Name">
<input type="text" id="contact" name="contact" placeholder="Contact Number" required>
<textarea id="address" name="address" placeholder="Complete Address" required></textarea>
<input type="email" id="email" name="email" placeholder="Email Address" required>
<input type="password" id="password" name="password" placeholder="Password" required>
 <!-- User Type Dropdown -->
  <label for="usertype">Register as:</label>
  <select id="user_type" name="user_type" required>
        <option value="">Select Type</option>
        <option value="guest customer">Guest Customer</option>
        <option value="admin">Admin</option>
  </select>
  <button type="submit">Register</button>
  <a href="home.html" class="back-link">🏠 Back to Home</a>
</form>


    <p id="message"></p>
  </div>

  <script src="register.js"></script>
</body>
</html>
