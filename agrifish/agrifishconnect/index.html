<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrifish Connect – Fresh Fish Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>Agrifish Connect – Fresh Fish Marketplace</h1>
        <p class="subtitle">Fresh, quality fish delivered to your doorstep</p>
        <!-- Login button -->
  <div class="top-right-buttons">
    <div class="name-marquee">
        <span id="customer-fullname">GUEST CUSTOMER</span>
    </div>
    <a href="login.html" id="login-btn"></a>
    <a href="buyer.html" id="buyer-btn">Account</a>
    <button class="btn logout-btn">Logout</button>
  </div>

    <!-- Main content: Responsive grid of fish cards -->
    <main class="marketplace">
        <section class="card-grid" id="card-grid">
            <!-- Products will be loaded dynamically from database -->
            <div class="loading">Loading fresh fish...</div>
        </section>
    </main>

    <!-- Modal Window (hidden by default) -->
    <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="modal-content">
            <!-- Modal Header -->
            <h2 id="modal-title"></h2>
            <!-- Price per kilo -->
            <p id="modal-price"></p>
            <!-- Quantity input -->
            <label for="quantity" class="modal-label">Select quantity:</label>
            <input type="number" id="quantity" min="0.1" step="0.1" value="1" class="modal-input" aria-label="Quantity in kilos">
            <!-- Live total calculation -->
            <p class="modal-total">Total: <span id="modal-total">₱0.00</span></p>
            <!-- Modal Actions -->
            <div class="modal-actions">
                <button id="confirm-btn" class="btn modal-btn">Confirm Purchase</button>
                <button id="cancel-btn" class="btn modal-btn cancel">Cancel</button>
            </div>
        </div>
        <!-- Modal overlay for closing modal when clicking outside -->
        <div class="modal-overlay"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Agrifish Connect. Fresh fish, sustainable fishing.</p>
    </footer>

    <!-- Link to external JS file -->
    <script src="script.js"></script>
</body>
</html>
