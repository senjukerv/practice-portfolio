<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – Agrifish Connect</title>
  
  
   <link rel="stylesheet" href="buyer.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Product</a>
    <a href="login.html" id="logout-btn">Logout</a>
    <a href="https://www.facebook.com/profile.php?id=61583233691669">Contact admin</a>
  </nav>

  <h1>My Orders</h1>
  <div id="orders-container">
    <div class="no-orders">Loading your orders...</div>
  </div>

  <!-- Message Modal -->
  <div id="message-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
      background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:400px; position:relative;">
      <h2>Send Message to Seller</h2>
      <textarea id="message-text" rows="5" style="width:100%; padding:10px;" placeholder="Type your message here..."></textarea>
      <div style="margin-top:10px; text-align:right;">
        <button id="close-msg-btn" style="margin-right:10px;">Cancel</button>
        <button id="send-msg-btn">Send</button>
      </div>
    </div>
  </div>

  <!-- JS files -->
  <script src="buyer.js"></script>
  

</body>
</html>
